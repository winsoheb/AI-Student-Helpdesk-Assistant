{% extends 'admin/base_admin.html' %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Frequently Asked Questions</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">Add FAQ</button>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>Category</th>
                    <th>Question</th>
                    <th>Answer</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for f in faqs %}
                <tr>
                    <td class="align-middle">
                        <span class="badge bg-secondary">{{ f.category }}</span>
                    </td>
                    <td class="align-middle">{{ f.question }}</td>
                    <td class="align-middle text-truncate" style="max-width: 200px;" title="{{ f.answer }}">{{ f.answer }}</td>
                    <td class="text-end">
                        <form method="POST" class="d-inline">
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="id" value="{{ f.id }}">
                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?');">Delete</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center py-3 text-muted">No FAQs found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <form method="POST" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add FAQ</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="action" value="add">
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
                <option value="General">General</option>
                <option value="Admission">Admission</option>
                <option value="Examination">Examination</option>
                <option value="Library">Library</option>
                <option value="Hostel">Hostel</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Question</label>
            <input type="text" name="question" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Answer</label>
            <textarea name="answer" class="form-control" rows="4" required></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save FAQ</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
