{% extends 'admin/base_admin.html' %}
{% block admin_content %}
<h2>Welcome, Admin!</h2>
<p class="text-muted">Manage college knowledge base and user accounts.</p>

<div class="row mt-4">
    <div class="col-md-3">
        <div class="card text-white bg-primary mb-3 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Students</h5>
                <p class="card-text fs-3">{{ stats.students }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success mb-3 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Departments</h5>
                <p class="card-text fs-3">{{ stats.departments }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info mb-3 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Courses</h5>
                <p class="card-text fs-3">{{ stats.courses }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning mb-3 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Subjects</h5>
                <p class="card-text fs-3">{{ stats.subjects }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
